# Only QA: publish health/control routes through the existing Frontend edge.
# Backend, broker, Core and PostgreSQL stay on the internal network exclusively.
server {
    listen 18080;
    location = /actuator/health {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $qa_backend http://backend:8080;
        proxy_pass $qa_backend;
    }
    location / { return 404; }
}
server {
    listen 18090;
    location / {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $qa_core http://core-mock:8090;
        proxy_pass $qa_core;
        client_max_body_size 1m;
    }
}
