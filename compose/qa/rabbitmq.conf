# QA only: the Backend requires AMQPS and verifies the server hostname.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certificates/ca.crt
ssl_options.certfile = /certificates/server.crt
ssl_options.keyfile = /certificates/server.key
# Authenticate clients using the local username/password over verified TLS.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
