services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in images.env}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TRACKING_CODE_ENCRYPTION_KEY_BASE64: ${TRACKING_CODE_ENCRYPTION_KEY_BASE64:?Set TRACKING_CODE_ENCRYPTION_KEY_BASE64 in .env}
      TRACKING_CODE_ENCRYPTION_KEY_ID: ${TRACKING_CODE_ENCRYPTION_KEY_ID:?Set TRACKING_CODE_ENCRYPTION_KEY_ID in .env}
      MOCK_CITIZEN_PASSWORD: ${MOCK_CITIZEN_PASSWORD:?Set MOCK_CITIZEN_PASSWORD in .env}
      MOCK_AGENT_PASSWORD: ${MOCK_AGENT_PASSWORD:?Set MOCK_AGENT_PASSWORD in .env}
      MOCK_AREA_RESPONSIBLE_PASSWORD: ${MOCK_AREA_RESPONSIBLE_PASSWORD:?Set MOCK_AREA_RESPONSIBLE_PASSWORD in .env}
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?Set MOCK_ADMIN_PASSWORD in .env}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_REQUESTS_PER_MINUTE: ${AI_MAX_REQUESTS_PER_MINUTE:-10}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-MOCK}
      M1_BASE_URL: ${M1_BASE_URL:-https://ciudadanos-m1-backend.onrender.com}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      M1_CONNECT_TIMEOUT: ${M1_CONNECT_TIMEOUT:-5s}
      M1_READ_TIMEOUT: ${M1_READ_TIMEOUT:-30s}
      CORE_OUTBOX_ENABLED: ${CORE_OUTBOX_ENABLED:-false}
      CORE_OUTBOX_AUTO_APPROVE_NEW_EVENTS: ${CORE_OUTBOX_AUTO_APPROVE_NEW_EVENTS:-false}
      CORE_OUTBOX_APPROVED_EVENT_IDS: ${CORE_OUTBOX_APPROVED_EVENT_IDS:-}
      CORE_RABBIT_HOST: ${CORE_RABBIT_HOST:-core-uade-2026.duckdns.org}
      CORE_RABBIT_PORT: ${CORE_RABBIT_PORT:-5671}
      CORE_RABBIT_VHOST: ${CORE_RABBIT_VHOST:-core}
      CORE_RABBIT_USERNAME: ${CORE_RABBIT_USERNAME:-}
      CORE_RABBIT_PASSWORD: ${CORE_RABBIT_PASSWORD:-}
      CORE_OUTBOX_MAX_ATTEMPTS: ${CORE_OUTBOX_MAX_ATTEMPTS:-5}
      CORE_OUTBOX_RETRY_DELAY: ${CORE_OUTBOX_RETRY_DELAY:-15s}
      CORE_OUTBOX_CONFIRM_TIMEOUT: ${CORE_OUTBOX_CONFIRM_TIMEOUT:-5s}
      CORE_OUTBOX_CONNECT_TIMEOUT: ${CORE_OUTBOX_CONNECT_TIMEOUT:-5s}
      CORE_OUTBOX_SCAN_DELAY: ${CORE_OUTBOX_SCAN_DELAY:-1000}
      CORE_INBOX_ENABLED: ${CORE_INBOX_ENABLED:-false}
      CORE_INBOX_PREFETCH: ${CORE_INBOX_PREFETCH:-1}
      CORE_INBOX_RECONNECT_DELAY: ${CORE_INBOX_RECONNECT_DELAY:-5000}
      ATTACHMENT_STORAGE_ROOT: ${ATTACHMENT_STORAGE_ROOT:-/var/lib/m2/attachments}
      # Only the private Nginx proxy and host loopback can reach this service.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      M2_PUBLIC_BASE_URL: https://${HTTPS_HOSTNAME:?Set HTTPS_HOSTNAME in .env}
      M2_AUTH_BROWSER_ORIGIN: https://${HTTPS_HOSTNAME:?Set HTTPS_HOSTNAME in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - attachment_data:/var/lib/m2/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in images.env}
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      HTTPS_HOSTNAME: ${HTTPS_HOSTNAME:?Set HTTPS_HOSTNAME in .env}
      LEGACY_HTTP_IP: ${LEGACY_HTTP_IP:-54.232.233.237}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    # Process/config liveness only. smoke-https.sh separately verifies public TLS.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  attachment_data:
  caddy_data:
  caddy_config:

networks:
  edge:
