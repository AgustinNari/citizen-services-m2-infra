services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in images.env}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MOCK_CITIZEN_PASSWORD: ${MOCK_CITIZEN_PASSWORD:?Set MOCK_CITIZEN_PASSWORD in .env}
      MOCK_AGENT_PASSWORD: ${MOCK_AGENT_PASSWORD:?Set MOCK_AGENT_PASSWORD in .env}
      MOCK_AREA_RESPONSIBLE_PASSWORD: ${MOCK_AREA_RESPONSIBLE_PASSWORD:?Set MOCK_AREA_RESPONSIBLE_PASSWORD in .env}
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?Set MOCK_ADMIN_PASSWORD in .env}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      ATTACHMENT_STORAGE_ROOT: ${ATTACHMENT_STORAGE_ROOT:-/var/lib/m2/attachments}
      # Only the private Nginx proxy and host loopback can reach this service.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      M2_PUBLIC_BASE_URL: https://${HTTPS_HOSTNAME:?Set HTTPS_HOSTNAME in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - attachment_data:/var/lib/m2/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in images.env}
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      HTTPS_HOSTNAME: ${HTTPS_HOSTNAME:?Set HTTPS_HOSTNAME in .env}
      LEGACY_HTTP_IP: ${LEGACY_HTTP_IP:-54.232.233.237}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    # Process/config liveness only. smoke-https.sh separately verifies public TLS.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  attachment_data:
  caddy_data:
  caddy_config:

networks:
  edge:
