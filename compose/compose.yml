services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../../../Backend/Backend-DAMII
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TRACKING_CODE_ENCRYPTION_KEY_BASE64: ${TRACKING_CODE_ENCRYPTION_KEY_BASE64:?Set TRACKING_CODE_ENCRYPTION_KEY_BASE64 in .env}
      TRACKING_CODE_ENCRYPTION_KEY_ID: ${TRACKING_CODE_ENCRYPTION_KEY_ID:?Set TRACKING_CODE_ENCRYPTION_KEY_ID in .env}
      MOCK_CITIZEN_PASSWORD: ${MOCK_CITIZEN_PASSWORD:?Set MOCK_CITIZEN_PASSWORD in .env}
      MOCK_AGENT_PASSWORD: ${MOCK_AGENT_PASSWORD:?Set MOCK_AGENT_PASSWORD in .env}
      MOCK_AREA_RESPONSIBLE_PASSWORD: ${MOCK_AREA_RESPONSIBLE_PASSWORD:?Set MOCK_AREA_RESPONSIBLE_PASSWORD in .env}
      MOCK_ADMIN_PASSWORD: ${MOCK_ADMIN_PASSWORD:?Set MOCK_ADMIN_PASSWORD in .env}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-MOCK}
      M1_BASE_URL: ${M1_BASE_URL:-https://ciudadanos-m1-backend.onrender.com}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      M2_AUTH_BROWSER_ORIGIN: ${M2_AUTH_BROWSER_ORIGIN:-}
      M2_PUBLIC_BASE_URL: ${M2_PUBLIC_BASE_URL:-http://localhost:8080}
      M1_CONNECT_TIMEOUT: ${M1_CONNECT_TIMEOUT:-5s}
      M1_READ_TIMEOUT: ${M1_READ_TIMEOUT:-30s}
      CORE_OUTBOX_ENABLED: ${CORE_OUTBOX_ENABLED:-false}
      CORE_OUTBOX_AUTO_APPROVE_NEW_EVENTS: ${CORE_OUTBOX_AUTO_APPROVE_NEW_EVENTS:-false}
      CORE_OUTBOX_APPROVED_EVENT_IDS: ${CORE_OUTBOX_APPROVED_EVENT_IDS:-}
      CORE_RABBIT_HOST: ${CORE_RABBIT_HOST:-core-uade-2026.duckdns.org}
      CORE_RABBIT_PORT: ${CORE_RABBIT_PORT:-5671}
      CORE_RABBIT_VHOST: ${CORE_RABBIT_VHOST:-core}
      CORE_RABBIT_USERNAME: ${CORE_RABBIT_USERNAME:-}
      CORE_RABBIT_PASSWORD: ${CORE_RABBIT_PASSWORD:-}
      CORE_OUTBOX_MAX_ATTEMPTS: ${CORE_OUTBOX_MAX_ATTEMPTS:-5}
      CORE_OUTBOX_RETRY_DELAY: ${CORE_OUTBOX_RETRY_DELAY:-15s}
      CORE_OUTBOX_CONFIRM_TIMEOUT: ${CORE_OUTBOX_CONFIRM_TIMEOUT:-5s}
      CORE_OUTBOX_CONNECT_TIMEOUT: ${CORE_OUTBOX_CONNECT_TIMEOUT:-5s}
      CORE_OUTBOX_SCAN_DELAY: ${CORE_OUTBOX_SCAN_DELAY:-1000}
      CORE_INBOX_ENABLED: ${CORE_INBOX_ENABLED:-false}
      CORE_INBOX_PREFETCH: ${CORE_INBOX_PREFETCH:-1}
      CORE_INBOX_RECONNECT_DELAY: ${CORE_INBOX_RECONNECT_DELAY:-5000}
      ATTACHMENT_STORAGE_ROOT: ${ATTACHMENT_STORAGE_ROOT:-/var/lib/m2/attachments}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - attachment_data:/var/lib/m2/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../../Frontend/front-desarrollo-apps-2/Front/frontend-atencion-ciudadana
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_IDENTITY_PROVIDER: ${VITE_IDENTITY_PROVIDER:-MOCK}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  attachment_data:
